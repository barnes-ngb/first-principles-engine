name: Deploy to Firebase

on:
  push:
    branches:
      - deploy
  # Manual trigger from the Actions tab (Run workflow button).
  # Use this when functions need to be redeployed without pushing a code change
  # (e.g., redeploying already-merged Cloud Functions like the monthly review set:
  # generateMonthlyReview, generateMonthlyReviewNow, publishMonthlyReview,
  # unpublishMonthlyReview). Manual runs force a full functions deploy
  # regardless of whether functions/ changed in the push.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for reliable diff

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Authenticate with GCP ───────────────────────────────────
      # Required IAM roles on the service account:
      #   - Cloud Functions Admin (roles/cloudfunctions.admin)
      #   - Service Account User (roles/iam.serviceAccountUser)
      #   - Cloud Build Editor (roles/cloudbuild.builds.editor)
      #   - Storage Admin (roles/storage.admin)
      #   - Artifact Registry Admin (roles/artifactregistry.admin)
      #   - Service Usage Consumer (roles/serviceusage.serviceUsageConsumer)
      #   - Firebase Extensions Viewer (roles/firebaseextensions.viewer)
      #   - Secret Manager Viewer (roles/secretmanager.viewer)
      #   - Secret Manager Secret Accessor (roles/secretmanager.secretAccessor)
      #
      # Secrets that must exist in Google Cloud Secret Manager:
      #   - CLAUDE_API_KEY   (firebase functions:secrets:set CLAUDE_API_KEY)
      #   - OPENAI_API_KEY   (firebase functions:secrets:set OPENAI_API_KEY)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ── Client app ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      # ── The rules gate, before anything is deployed (FIX-265) ────
      # `firestore.rules` is deployed by this workflow, so the suite that proves
      # what it admits runs here as well as on the PR: a push straight to
      # `deploy` would otherwise publish a ruleset nothing in this run checked.
      # It needs a JVM (the Firestore emulator is a Java process) and nothing
      # else — `npm run test:rules` runs against the `demo-fpe-rules` project,
      # which firebase-tools serves entirely locally and which can never resolve
      # to barneshome-3dfbb, so the service-account credentials in this job are
      # not used by it.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules suite (emulator)
        run: npm run test:rules

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # ── Deploy rules FIRST, then hosting (always) ────────────────
      #
      # RULES BEFORE APP (FIX-265). `firestore.rules` now carries the admission
      # contract the FEAT-242 client satisfies and the pre-FEAT-242 client does
      # not, so the two deploys have a direction: the rules must be live before a
      # bundle that relies on them is served. These steps used to run AFTER both
      # hosting deploys, and for THIS change that order is not a tidiness
      # complaint — publishing the completion-enabled app while the old rules were
      # still in force would leave the window this repair exists to close open:
      # old writers admitted, a correction able to land with no marker and a
      # confirmed completion left resting on it.
      #
      # A step failure stops the job, so a rules deploy that fails means NO app
      # deploy: production keeps serving the previous bundle under the previous
      # rules, which is a consistent pair. That dependency is the point of the
      # ordering and is pinned by
      # `src/test/firestoreRulesGate.invariant.test.ts`; do not add
      # `continue-on-error` or an `if:` that lets hosting run regardless.
      - name: Deploy Firestore rules + indexes
        run: npx firebase-tools@latest deploy --only firestore --project barneshome-3dfbb --non-interactive --force

      - name: Deploy Storage rules
        run: npx firebase-tools@latest deploy --only storage --project barneshome-3dfbb --non-interactive --force

      # Firestore publishes a ruleset to its serving edges asynchronously: the
      # deploy returning success means the ruleset is COMMITTED, not that every
      # edge is evaluating it. Firebase documents propagation to active listeners
      # as taking UP TO TEN MINUTES, so this waits the full documented window —
      # a conservative allowance rather than an optimistic average — before the
      # app that depends on the new rules is published. It costs ten minutes of a
      # deploy that happens a few times a week. The number lives in one place so
      # it can be tuned (or, with owner approval, removed) in one edit.
      - name: Wait for Firestore rules propagation
        env:
          RULES_PROPAGATION_SECONDS: '600'
        run: |
          echo "Rules deployed. Waiting ${RULES_PROPAGATION_SECONDS}s for propagation before publishing the app."
          sleep "${RULES_PROPAGATION_SECONDS}"

      # Two hosting targets (FEAT-86): `app` = the main SPA (first-principles-engine),
      # `shop` = the dedicated barnesbro.web.app catalog redirect. The action's
      # `target` input deploys ONE target per step, so the app deploy stays
      # byte-equivalent in behavior — only the shop step is new.
      #
      # ORDER MATTERS (Codex P1): deploy `shop` FIRST. The app bundle promotes
      # https://barnesbro.web.app as the primary "Copy link", so it must not go
      # live until the shop site actually exists and serves. If the shop deploy
      # fails (site not created yet, name fell back, permissions), this step
      # fails and the workflow stops BEFORE the app deploy — so production keeps
      # the previous app bundle (still on the working direct Storage link) rather
      # than publishing a promoted-but-dead short link. Once shop succeeds, the
      # short link is guaranteed live before the app that promotes it.
      - name: Deploy Hosting (shop)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: barneshome-3dfbb
          target: shop

      - name: Deploy Hosting (app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: barneshome-3dfbb
          target: app

      - name: Configure Storage CORS
        run: |
          # Explicitly activate the service account so gcloud/gsutil have full auth.
          # The auth@v2 action sets GOOGLE_APPLICATION_CREDENTIALS but doesn't always
          # activate it in gcloud's internal auth chain (CORS update uses gsutil transport).
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"

          BUCKET_NEW="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
          BUCKET_LEGACY="barneshome-3dfbb.appspot.com"

          # Determine which bucket exists
          BUCKET=""
          if [ -n "$BUCKET_NEW" ]; then
            echo "Trying bucket: $BUCKET_NEW"
            if gcloud storage buckets describe "gs://$BUCKET_NEW" --format="value(name)" 2>/dev/null; then
              BUCKET="$BUCKET_NEW"
            fi
          fi
          if [ -z "$BUCKET" ]; then
            echo "Trying legacy bucket: $BUCKET_LEGACY"
            if gcloud storage buckets describe "gs://$BUCKET_LEGACY" --format="value(name)" 2>/dev/null; then
              BUCKET="$BUCKET_LEGACY"
            fi
          fi

          if [ -z "$BUCKET" ]; then
            echo "::warning::Could not find storage bucket. CORS not configured."
            exit 0
          fi

          echo "Setting CORS on gs://$BUCKET"
          gcloud storage buckets update "gs://$BUCKET" --cors-file=storage-cors.json
          echo "CORS configured successfully on gs://$BUCKET"

          # Verify
          echo "Verifying CORS config:"
          gcloud storage buckets describe "gs://$BUCKET" --format="json(cors_config)"

      # ── Cloud Functions (when functions/ has changes, or on manual run) ──
      # The range is the whole PUSH — `github.event.before` (where `deploy` was)
      # to `github.sha` — never the last commit alone (FIX-261: the old
      # `merge-base HEAD HEAD~1` was always HEAD~1, so a push whose last commit
      # skipped functions/ skipped the deploy). An unreadable range (new branch,
      # force-push) deploys, and a manual run always deploys.
      - name: Check for functions changes
        id: functions-changed
        run: node scripts/deploy-functions-changed.mjs "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}"

      - name: Install functions dependencies
        if: steps.functions-changed.outputs.changed == 'true'
        run: cd functions && npm ci

      - name: Lint functions
        if: steps.functions-changed.outputs.changed == 'true'
        run: cd functions && npm run lint

      - name: Test functions
        if: steps.functions-changed.outputs.changed == 'true'
        run: cd functions && npm test

      - name: Build functions
        if: steps.functions-changed.outputs.changed == 'true'
        run: cd functions && npm run build

      - name: Deploy Cloud Functions
        if: steps.functions-changed.outputs.changed == 'true'
        run: npx firebase-tools@latest deploy --only functions --project barneshome-3dfbb --non-interactive --force

      - name: Deploy Firestore indexes (with functions)
        if: steps.functions-changed.outputs.changed == 'true'
        run: npx firebase-tools@latest deploy --only firestore:indexes --project barneshome-3dfbb --non-interactive --force
